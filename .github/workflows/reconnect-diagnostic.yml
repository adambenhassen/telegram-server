name: Reconnect diagnostic

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from this repository's main history
        required: true
        type: string
      repetitions:
        description: Number of focused runs (maximum 3)
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      parallel_e2e:
        description: Run the full e2e package alongside the focused test
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  reconnect-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate manual request
        id: request
        env:
          REQUEST_SHA: ${{ inputs.commit_sha }}
          REPETITIONS: ${{ inputs.repetitions }}
          PARALLEL_E2E: ${{ inputs.parallel_e2e }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "dispatch this diagnostic from main" >&2
            exit 1
          fi
          if [[ ! "$REQUEST_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit SHA must be 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          case "$REPETITIONS" in
            1|2|3) ;;
            *) echo "repetitions must be 1, 2, or 3" >&2; exit 1 ;;
          esac
          case "$PARALLEL_E2E" in
            true) load_mode=parallel-e2e ;;
            false) load_mode=isolated ;;
            *) echo "parallel-e2e input must be boolean" >&2; exit 1 ;;
          esac
          printf 'source_sha=%s\n' "$REQUEST_SHA" >> "$GITHUB_OUTPUT"
          printf 'load_mode=%s\n' "$load_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout requested source revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify revisions and initialize safe artifact
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPETITIONS: ${{ inputs.repetitions }}
          PARALLEL_E2E: ${{ inputs.parallel_e2e }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C harness rev-parse HEAD)" == "$WORKFLOW_SHA" ]]
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          if ! git -C harness merge-base --is-ancestor "$SOURCE_SHA" "$WORKFLOW_SHA"; then
            echo "source SHA must be in the dispatched main history" >&2
            exit 1
          fi

          mkdir -p reconnect-diagnostics
          if [[ "$PARALLEL_E2E" == "true" ]]; then
            load_mode=parallel-e2e
            load_command="GOTOOLCHAIN=go1.26.6 go test -race -json -count=1 -timeout 15m ./test/e2e"
            load_status=not_run
            load_time=not_run
          else
            load_mode=isolated
            load_command=not_requested
            load_status=not_requested
            load_time=not_requested
          fi
          {
            printf 'workflow_sha=%s\n' "$WORKFLOW_SHA"
            printf 'tested_sha=%s\n' "$SOURCE_SHA"
            printf 'repetition_count=%s\n' "$REPETITIONS"
            printf 'load_mode=%s\n' "$load_mode"
            printf "focused_command=GOTOOLCHAIN=go1.26.6 go test -race -json -count=%s -timeout 15m ./test/e2e -run '^TestMessagingReconnectPushGap$'\n" "$REPETITIONS"
            printf 'load_command=%s\n' "$load_command"
            printf 'go_version=not_run\n'
            printf 'focused_exit_code=not_run\n'
            printf 'focused_process_elapsed_seconds=not_run\n'
            printf 'load_exit_code=%s\n' "$load_status"
            printf 'load_process_elapsed_seconds=%s\n' "$load_time"
            printf 'focused_scenario_result=not_run\n'
            printf 'load_suite_outcome=%s\n' "$load_status"
            printf 'diagnostic_runner_status=prepared\n'
          } > reconnect-diagnostics/diagnostics.txt

      - name: Validate diagnostic log controls
        run: python3 -m unittest discover -s harness/.github/scripts -p 'test_reconnect_diagnostics.py'

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Run bounded reconnect diagnostic
        id: diagnostic
        timeout-minutes: 20
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPETITIONS: ${{ inputs.repetitions }}
          PARALLEL_E2E: ${{ inputs.parallel_e2e }}
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/.github/scripts/reconnect_diagnostics.py run \
            --harness-dir harness \
            --source-dir source \
            --workflow-sha "$WORKFLOW_SHA" \
            --source-sha "$SOURCE_SHA" \
            --repetitions "$REPETITIONS" \
            --parallel-e2e "$PARALLEL_E2E" \
            --output reconnect-diagnostics/diagnostics.txt \
            --artifact-ready-output "$GITHUB_OUTPUT"

      - name: Upload allow-listed diagnostics
        if: ${{ always() && steps.diagnostic.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reconnect-diagnostic-${{ steps.request.outputs.source_sha }}-${{ steps.request.outputs.load_mode }}
          path: reconnect-diagnostics/diagnostics.txt
          retention-days: 7
          if-no-files-found: ignore
