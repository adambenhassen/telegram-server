name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

      - uses: ariga/setup-atlas@v0.3

      - name: Validate migrations
        run: atlas migrate validate --dir file://migrations

      # Postgres comes from testcontainers inside internal/pgtest, which starts
      # postgres:16-alpine with its own config. Nothing to wire up on the runner
      # beyond the Docker daemon ubuntu-latest already provides.
      - name: Test
        run: go test ./...
